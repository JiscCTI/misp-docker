site_name: Jisc CTI - MISP
site_url: https://jisccti.github.io/misp-docker/
repo_url: https://github.com/jisccti/misp-docker/
repo_name: GitHub
edit_uri: blob/main/pages/
docs_dir: pages
site_description: Documentation for running MISP with the Docker images produced by Jisc's Cyber Threat Intelligence team.
site_author: Jisc's Cyber Threat Intelligence Team
copyright: 2024-2026 Jisc Services Limited
nav:
  - Introduction: index.md
  - Change Log: changelog.md
  - Requirements: requirements.md
  - Deployment Options:
    - On-Premises: deploy/local.md
    - Cloud: deploy/cloud.md
  - Configuration:
    - General: configuration/general.md
    - Single Sign On:
      - Keycloak: configuration/keycloak.md
      - Microsoft Entra ID: configuration/entra-id.md
      - OpenID Connect (OIDC): configuration/oidc.md
      - SAML2/Shibboleth: configuration/shibb.md
    - Splunk: splunk.md
    - Customisation: configuration/custom.md
  - First Start: first_start.md
  - Management:
    - Backups: management/backups.md
    - Logging: management/logging.md
    - Maintenance Tasks: management/maint_tasks.md
    - Upgrading MISP: management/updates.md
    - Manual Upgrades:
      - MySQL 9.7 Upgrade: upgrade/mysql_9_7.md
  - Development:
    - Principles: dev/principles.md
    - Images:
      - misp-modules: dev/misp-modules.md
      - misp-shibb-sp: dev/misp-shibb-sp.md
      - misp-web: dev/misp-web.md
      - misp-workers: dev/misp-workers.md
    - GitHub Actions: dev/gh-actions.md
theme:
  name: material
  features:
    - content.code.copy
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences